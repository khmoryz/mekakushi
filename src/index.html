<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekakushi</title>
    <style>
        /* Iceburg Color Palette */
        :root {
            /* Iceburg Dark Theme Colors */
            --bg-primary: #161821;
            --bg-secondary: #1e2132;
            --bg-tertiary: #242940;
            --bg-quaternary: #2a2f4a;

            /* Text Colors */
            --text-primary: #c6c8d1;
            --text-secondary: #9a9ca5;
            --text-tertiary: #6b7089;
            --text-accent: #84a0c6;

            /* Accent Colors */
            --accent-blue: #84a0c6;
            --accent-cyan: #89b8c2;
            --accent-green: #b4be82;
            --accent-yellow: #e2a478;
            --accent-red: #e27878;
            --accent-purple: #a093c7;

            /* UI Colors */
            --border-primary: #3e445e;
            --border-secondary: #2a2f4a;
            --shadow-light: rgba(0, 0, 0, 0.2);
            --shadow-medium: rgba(0, 0, 0, 0.3);
            --shadow-heavy: rgba(0, 0, 0, 0.5);

            /* Highlight Colors */
            --highlight-bg: rgba(132, 160, 198, 0.2);
            --highlight-border: rgba(132, 160, 198, 0.4);
            --selection-bg: rgba(132, 160, 198, 0.3);

            /* macOS System Spacing (8pt grid) */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;

            /* Border Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 12px;
        }

        /* Base Styles */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* App Window Structure */
        .app-window {
            height: 100vh;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        /* Project Header */
        .project-header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: var(--spacing-sm) var(--spacing-md) var(--spacing-sm) 80px;
            /* 左側paddingを80pxに戻す */
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-secondary);
            min-height: 48px;
        }

        .project-selector {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .project-selector label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-accent);
            white-space: nowrap;
        }

        .project-dropdown {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            padding: var(--spacing-xs) var(--spacing-sm);
            min-width: 200px;
            outline: none;
            transition: all 0.2s ease;
        }

        .project-dropdown:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(132, 160, 198, 0.1);
        }

        .project-dropdown option {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .project-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .project-btn:hover {
            background: var(--accent-blue);
            color: var(--bg-primary);
            border-color: var(--accent-blue);
            transform: translateY(-1px);
        }

        /* 削除ボタンの特別なスタイル */
        #deleteProjectBtn:hover {
            background: var(--accent-red);
            color: var(--bg-primary);
            border-color: var(--accent-red);
            transform: translateY(-1px);
        }

        /* Main Container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: row;
            /* 横並びに修正 */
            padding: var(--spacing-md);
            gap: var(--spacing-md);
            min-height: 0;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            min-width: 0;
        }

        /* Text Panels */
        .text-panels {
            display: flex;
            gap: var(--spacing-md);
            flex: 1;
            min-height: 0;
        }

        .text-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: var(--spacing-md);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .text-panel h2 {
            color: var(--text-accent);
            margin: 0 0 var(--spacing-sm) 0;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        /* Textarea Container */
        .textarea-container {
            position: relative;
            flex: 1;
            min-height: 320px;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        /* Textarea Overlay Pattern */
        .backdrop,
        .text-panel textarea {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            padding: var(--spacing-md);
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: auto;
        }

        .backdrop {
            z-index: 1;
            color: transparent;
            pointer-events: none;
            background: var(--bg-tertiary);
        }

        .text-panel textarea {
            z-index: 2;
            resize: none;
            outline: none;
            transition: all 0.2s ease;
            color: var(--text-primary);
            caret-color: var(--accent-blue);
            background: transparent;
        }

        outline: none;
        transition: all 0.2s ease;
        color: var(--text-primary);
        caret-color: var(--accent-blue);
        background: transparent;
        }

        /* テキスト選択時のハイライト */
        .text-panel textarea::selection {
            background: rgba(132, 160, 198, 0.5);
        }

        .text-panel textarea::-moz-selection {
            background: rgba(132, 160, 198, 0.5);
        }

        /* backdrop内のハイライトスタイル */
        .backdrop .masked-highlight {
            color: transparent;
            background: var(--highlight-bg);
            border-radius: 2px;
        }

        .text-panel textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(132, 160, 198, 0.1);
        }

        .text-panel textarea::placeholder {
            color: var(--text-tertiary);
            opacity: 1;
        }

        /* Copy Button */
        .copy-button {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: var(--accent-blue);
            color: var(--bg-primary);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 3;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0.7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .copy-button:hover {
            background: var(--accent-cyan);
            opacity: 1;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(132, 160, 198, 0.3);
        }

        .copy-button:active {
            transform: translateY(0);
        }

        /* Copy Icon - 円の中に四角が斜めに重なるアイコン */
        .copy-button::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1.5px solid currentColor;
            border-radius: 2px;
            top: 10px;
            left: 10px;
        }

        .copy-button::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1.5px solid currentColor;
            border-radius: 2px;
            top: 14px;
            left: 14px;
            background: var(--accent-blue);
        }

        .copy-button:hover::after {
            background: var(--accent-cyan);
        }

        /* Conversion Controls */
        .conversion-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm);
            min-width: 20px;
            max-width: 20px;
        }

        .conversion-arrow {
            width: 16px;
            height: 16px;
            position: relative;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        /* 右向き矢印 - 一体化したデザイン */
        .conversion-arrow.right::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 12px;
            height: 2px;
            background: var(--text-tertiary);
            transform: translateY(-50%);
        }

        .conversion-arrow.right::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 10px;
            width: 0;
            height: 0;
            border-left: 6px solid var(--text-tertiary);
            border-top: 3px solid transparent;
            border-bottom: 3px solid transparent;
            transform: translateY(-50%);
        }

        /* 左向き矢印 - 一体化したデザイン */
        .conversion-arrow.left::before {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 12px;
            height: 2px;
            background: var(--text-tertiary);
            transform: translateY(-50%);
        }

        .conversion-arrow.left::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 10px;
            width: 0;
            height: 0;
            border-right: 6px solid var(--text-tertiary);
            border-top: 3px solid transparent;
            border-bottom: 3px solid transparent;
            transform: translateY(-50%);
        }

        /* Dictionary Panel */
        .dictionary-panel {
            width: 320px;
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            align-self: stretch;
            /* 親コンテナの高さに合わせる */
        }

        .dictionary-panel h2 {
            color: var(--text-accent);
            margin: 0 0 var(--spacing-sm) 0;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-xs);
            cursor: pointer;
            user-select: none;
        }

        .dictionary-toggle {
            background: none;
            border: none;
            color: var(--text-accent);
            cursor: pointer;
            font-size: 16px;
            padding: var(--spacing-xs);
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
        }

        .dictionary-toggle:hover {
            color: var(--accent-blue);
        }

        .dictionary-panel.collapsed .dictionary-toggle {
            transform: rotate(-90deg);
        }

        .dictionary-panel.collapsed .dictionary-list {
            display: none;
        }

        /* 小さい画面幅では辞書パネル全体を非表示 */
        .dictionary-panel.collapsed {
            width: 48px;
            min-width: 48px;
            padding: var(--spacing-md) var(--spacing-xs);
        }

        .dictionary-panel.collapsed h2 {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            margin: 0;
            white-space: nowrap;
        }

        .dictionary-panel.collapsed h2 span {
            display: none;
        }

        .dictionary-panel.collapsed .dictionary-toggle {
            transform: rotate(0deg);
            writing-mode: horizontal-tb;
        }

        .dictionary-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            padding: var(--spacing-sm);
            background: var(--bg-tertiary);
            min-height: 0;
            /* Flexboxの縮小を許可 */
        }

        .dictionary-empty {
            color: var(--text-tertiary);
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-md);
            font-style: italic;
            font-size: 13px;
        }

        .dictionary-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-sm) var(--spacing-md);
            margin-bottom: var(--spacing-xs);
            background: var(--bg-quaternary);
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .dictionary-item:hover {
            border-color: var(--accent-blue);
            background: rgba(132, 160, 198, 0.1);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px var(--shadow-light);
        }

        .dictionary-content {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            flex: 1;
            min-width: 0;
        }

        .dictionary-original {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        .dictionary-arrow {
            color: var(--text-tertiary);
            font-size: 11px;
        }

        .dictionary-masked {
            color: var(--accent-cyan);
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        .dictionary-count {
            font-size: 10px;
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        .dictionary-delete {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 14px;
            padding: var(--spacing-xs);
            border-radius: 3px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .dictionary-delete:hover {
            background: rgba(226, 120, 120, 0.2);
            transform: scale(1.1);
        }

        /* Candidate Popup */
        .candidate-popup {
            position: absolute;
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            box-shadow: 0 16px 32px var(--shadow-medium);
            padding: var(--spacing-md);
            z-index: 1000;
            display: none;
            min-width: 320px;
            max-width: 420px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .candidate-popup.show {
            display: block;
            animation: popupFadeIn 0.2s ease-out;
        }

        @keyframes popupFadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .popup-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-accent);
            margin-bottom: var(--spacing-sm);
            text-align: center;
        }

        .candidate-categories {
            display: flex;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-sm);
            justify-content: center;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: var(--spacing-xs) var(--spacing-sm);
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .category-btn:hover {
            background: var(--bg-quaternary);
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .category-btn.active {
            background: var(--accent-blue);
            color: var(--bg-primary);
            border-color: var(--accent-blue);
        }

        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: var(--spacing-xs);
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            padding: var(--spacing-sm);
            background: var(--bg-tertiary);
        }

        .candidate-item {
            padding: var(--spacing-xs) var(--spacing-sm);
            border: 1px solid var(--border-secondary);
            border-radius: 4px;
            background: var(--bg-quaternary);
            color: var(--text-primary);
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .candidate-item:hover {
            background: var(--accent-blue);
            color: var(--bg-primary);
            border-color: var(--accent-blue);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(132, 160, 198, 0.3);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-primary);
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .dictionary-panel {
                width: 280px;
            }
        }

        @media (max-width: 800px) {
            .project-header {
                flex-direction: column;
                gap: var(--spacing-sm);
                align-items: stretch;
            }

            .project-selector {
                justify-content: center;
            }

            .project-dropdown {
                min-width: 150px;
            }

            .container {
                flex-direction: column;
                padding: var(--spacing-sm);
            }

            .dictionary-panel {
                width: 100%;
                height: 200px;
            }

            .text-panels {
                flex-direction: column;
                gap: var(--spacing-sm);
            }

            .conversion-controls {
                flex-direction: row;
                padding: var(--spacing-sm) 0;
                min-width: auto;
                max-width: none;
                gap: var(--spacing-md);
            }

            .textarea-container {
                min-height: 240px;
            }
        }

        /* Focus and Selection States */
        *:focus {
            outline: none;
        }

        ::selection {
            background: var(--selection-bg);
            color: var(--text-primary);
        }

        ::-moz-selection {
            background: var(--selection-bg);
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div class="app-window">
        <!-- プロジェクト選択ヘッダー -->
        <div class="project-header">
            <div class="project-selector">
                <label for="projectSelect">📁 プロジェクト:</label>
                <select id="projectSelect" class="project-dropdown">
                    <option value="">プロジェクトを選択...</option>
                </select>
                <button id="newProjectBtn" class="project-btn" title="新しいプロジェクトを作成">➕</button>
                <button id="deleteProjectBtn" class="project-btn" title="現在のプロジェクトを削除">🗑️</button>
            </div>
        </div>

        <div class="container">
            <!-- メインコンテンツエリア -->
            <div class="main-content">
                <!-- テキストパネルと変換コントロール -->
                <div class="text-panels">
                    <!-- 入力テキストパネル -->
                    <div class="text-panel">
                        <h2>📝 入力テキスト</h2>
                        <div class="textarea-container">
                            <div class="backdrop" id="inputBackdrop"></div>
                            <textarea id="inputText"
                                placeholder="ここにテキストを入力してください...&#10;例: My password is secret123&#10;&#10;💡 テキストを選択するとマスク候補が表示されます"></textarea>
                            <button class="copy-button" onclick="copyInputText()" title="入力テキストをコピー"></button>
                        </div>
                    </div>

                    <!-- 変換コントロール -->
                    <div class="conversion-controls">
                        <div class="conversion-arrow right"></div>
                        <div class="conversion-arrow left"></div>
                    </div>

                    <!-- マスキング済みテキストパネル -->
                    <div class="text-panel">
                        <h2>🔒 マスキング済みテキスト</h2>
                        <div class="textarea-container">
                            <div class="backdrop" id="outputBackdrop"></div>
                            <textarea id="outputText" placeholder="マスキング結果がここに表示されます..."></textarea>
                            <button class="copy-button" onclick="copyOutputText()" title="マスキング済みテキストをコピー"></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側辞書パネル -->
            <div class="dictionary-panel" id="dictionaryPanel">
                <h2 onclick="toggleDictionary()">
                    <span>📚 マスキング辞書</span>
                    <button class="dictionary-toggle" id="dictionaryToggle">▼</button>
                </h2>
                <div class="dictionary-list" id="dictionaryList">
                    <div class="dictionary-empty">まだマスキングした単語がありません</div>
                </div>
            </div>

            <!-- ポップアップ候補選択 -->
            <div class="candidate-popup" id="candidatePopup">
                <div class="popup-title">🎭 マスク候補を選択</div>
                <div class="candidate-categories">
                    <button class="category-btn active" onclick="setCategory('symbols')">🔤 記号・文字</button>
                    <button class="category-btn" onclick="setCategory('fruits')">🍎 果物</button>
                    <button class="category-btn" onclick="setCategory('animals')">🐱 動物</button>
                    <button class="category-btn" onclick="setCategory('stars')">⭐ 星</button>
                    <button class="category-btn" onclick="setCategory('colors')">🎨 色</button>
                    <button class="category-btn" onclick="setCategory('countries')">🌍 国</button>
                </div>
                <div class="candidate-grid" id="candidateGrid">
                    <!-- 候補がここに動的に表示される -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/models/ProjectModel.js"></script>
    <script src="js/utils/FileSystemStructure.js"></script>
    <script src="js/managers/ProjectManager.js"></script>
    <script>
        // DOM要素の参照
        const inputTextArea = document.getElementById('inputText');
        const outputTextArea = document.getElementById('outputText');
        const inputBackdrop = document.getElementById('inputBackdrop');
        const outputBackdrop = document.getElementById('outputBackdrop');
        const candidatePopup = document.getElementById('candidatePopup');

        // 辞書の永続化機能
        async function loadDictionaryFromStore() {
            try {
                if (window.electronAPI && projectManager && projectManager.getCurrentProject()) {
                    const currentProject = projectManager.getCurrentProject();
                    const storedDict = await window.electronAPI.loadProjectDictionary(currentProject.id);
                    maskingDictionary.clear();

                    // オブジェクトからMapに変換
                    if (storedDict && storedDict.entries) {
                        for (const [key, value] of Object.entries(storedDict.entries)) {
                            // lastUsedを日付オブジェクトに変換
                            if (value.lastUsed) {
                                value.lastUsed = new Date(value.lastUsed);
                            }
                            maskingDictionary.set(key, value);
                        }
                    }

                    console.log('プロジェクト辞書をロードしました:', maskingDictionary.size, '件');
                    updateDictionaryDisplay();
                    syncInputToOutput();
                } else if (window.electronAPI) {
                    // 従来の辞書ロード（プロジェクト未選択時）
                    const storedDict = await window.electronAPI.getDictionary();
                    maskingDictionary.clear();

                    // オブジェクトからMapに変換
                    for (const [key, value] of Object.entries(storedDict)) {
                        // lastUsedを日付オブジェクトに変換
                        if (value.lastUsed) {
                            value.lastUsed = new Date(value.lastUsed);
                        }
                        maskingDictionary.set(key, value);
                    }

                    console.log('辞書をロードしました:', maskingDictionary.size, '件');

        async function saveDictionaryToStore() {

                if (window.electronAPI && projectManager && projectManager.getCurrentProject()) {
                    const currentProject = projectManager.getCurrentProject();

                    // Mapをオブジェクトに変換
                    const entriesObj = {};
                    for (const [key, entry] of maskingDictionary) {
                        entriesObj[key] = entry;
                    }

                    const dictionaryData = {
                        projectId: currentProject.id,
                        entries: entriesObj,
                        version: '1.0',
                        lastModified: new Date().toISOString()
                    };

                    await window.electronAPI.saveProjectDictionary(currentProject.id, dictionaryData);
                    console.log('プロジェクト辞書を保存しました:', maskingDictionary.size, '件');
                } else if (window.electronAPI) {
                    // 従来の辞書保存（プロジェクト未選択時）
                    const dictObj = Object.fromEntries(maskingDictionary);
                    await window.electronAPI.setDictionary(dictObj);
                    console.log('辞書を保存しました:', maskingDictionary.size, '件');
                }
            } catch (error) {
                console.error('辞書の保存に失敗しました:', error);

        async function handleDeleteCurrentProject() {
            const currentProject = projectManager.getCurrentProject();

            if (!currentProject) {
                await showMessageDialog('情報', '削除するプロジェクトが選択されていません。', 'info');
                return;
            }

            // プロジェクトが1つしかない場合は削除を禁止
            const projects = projectManager.listProjects();
            if (projects.length <= 1) {
                await showMessageDialog('エラー', '最後のプロジェクトは削除できません。\n新しいプロジェクトを作成してから削除してください。', 'error');
                return;
            }

            const confirmDelete = await showConfirmDialog(
                'プロジェクト削除の確認',
                `プロジェクト "${currentProject.name}" を削除しますか？\nこの操作は取り消せません。`
            );

            if (confirmDelete) {
                try {
                    const projectIdToDelete = currentProject.id;

                    // 他のプロジェクトに切り替え（削除対象以外の最初のプロジェクト）
                    const otherProjects = projects.filter(p => p.id !== projectIdToDelete);
                    if (otherProjects.length > 0) {
                        await projectManager.switchProject(otherProjects[0].id);
                        projectSelect.value = otherProjects[0].id;
                        await loadDictionaryFromStore();
                    }

                    // プロジェクトを削除
                    await projectManager.deleteProject(projectIdToDelete);
                    await updateProjectList();

                    console.log('Project deleted:', currentProject.name);
                    await showMessageDialog('完了', `プロジェクト "${currentProject.name}" を削除しました。`, 'info');
                } catch (error) {
                    console.error('Failed to delete project:', error);
                    await showMessageDialog('エラー', 'プロジェクトの削除に失敗しました: ' + error.message, 'error');
                }
            }
        }

        // HTMLエスケープ関数
        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // グローバルスコープに追加
        window.escapeHtml = escapeHtml;

        // 正規表現エスケープ関数
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // グローバルスコープに追加
        window.escapeRegExp = escapeRegExp;

        // ハイライト表示関数（提供されたパターンを使用）
        function highlight(text, targets) {
            if (!targets || targets.length === 0) {
                return escapeHtml(text);
            }

            // 長い順にソート（部分文字列の問題を避けるため）
            const sortedTargets = [...targets].sort((a, b) => b.length - a.length);

            let result = escapeHtml(text);

            for (const target of sortedTargets) {
                if (!target) continue;
                const escapedTarget = escapeRegExp(target);
                const regex = new RegExp(escapedTarget, 'gi');
                result = result.replace(regex, '<span class="masked-highlight">' + escapeHtml(target) + '</span>');
            }

            return result;
        }

        // グローバルスコープに追加
        window.highlight = highlight;

        // グローバル関数として定義
        // リアルタイム同期: 入力テキストの変更を出力に反映
        function syncInputToOutput() {
            try {
                console.log('syncInputToOutput called');
                console.log('inputTextArea:', inputTextArea);
                console.log('outputTextArea:', outputTextArea);

                if (!inputTextArea || !outputTextArea) {
                    console.error('DOM elements not found');
                    return;
                }

                const inputText = inputTextArea.value;
                let outputText = inputText;

                console.log('Input text:', inputText);

                // 辞書に基づいて自動マスキング
                for (const [key, entry] of maskingDictionary.entries()) {
                    const regex = new RegExp(escapeRegExp(entry.original), 'gi');
                    outputText = outputText.replace(regex, entry.masked);
                }

                outputTextArea.value = outputText;
                console.log('Output text set to:', outputText);

                // ハイライト表示を更新
                updateHighlights();

                console.log('Text sync completed:', { inputLength: inputText.length, outputLength: outputText.length });
            } catch (error) {
                console.error('Error in syncInputToOutput:', error);
            }
        }

        // グローバルスコープに追加
        window.syncInputToOutput = syncInputToOutput;

        // 逆方向同期: 出力テキストの変更を入力に反映
        function syncOutputToInput() {
            try {
                console.log('syncOutputToInput called');
                console.log('outputTextArea:', outputTextArea);
                console.log('inputTextArea:', inputTextArea);

                if (!inputTextArea || !outputTextArea) {
                    console.error('DOM elements not found');
                    return;
                }

                const outputText = outputTextArea.value;
                let inputText = outputText;

                console.log('Output text:', outputText);

                // 辞書に基づいて逆マスキング（マスクされた文字列を元に戻す）
                for (const [key, entry] of maskingDictionary.entries()) {
                    const regex = new RegExp(escapeRegExp(entry.masked), 'gi');
                    inputText = inputText.replace(regex, entry.original);
                }

                inputTextArea.value = inputText;
                console.log('Input text set to:', inputText);

                // ハイライト表示を更新
                updateHighlights();

                console.log('Reverse sync completed:', { outputLength: outputText.length, inputLength: inputText.length });
            } catch (error) {
                console.error('Error in syncOutputToInput:', error);
            }
        }

        // グローバルスコープに追加
        window.syncOutputToInput = syncOutputToInput;

        // ハイライト表示を更新
        function updateHighlights() {
            // 入力テキストのハイライト更新（元の文字列をハイライト）
            const inputTargets = Array.from(maskingDictionary.values()).map(entry => entry.original);
            inputBackdrop.innerHTML = highlight(inputTextArea.value, inputTargets);

            // 出力テキストのハイライト更新（マスクされた文字列をハイライト）
            const outputTargets = Array.from(maskingDictionary.values()).map(entry => entry.masked);
            outputBackdrop.innerHTML = highlight(outputTextArea.value, outputTargets);

            // 選択範囲のハイライトを反映
            updateSelectionHighlight();
        }

        // 選択範囲をbackdropに反映する関数
        function updateSelectionHighlight() {
            // 入力テキストエリアの選択範囲を反映
            applySelectionToBackdrop(inputTextArea, inputBackdrop);
            // 出力テキストエリアの選択範囲を反映
            applySelectionToBackdrop(outputTextArea, outputBackdrop);
        }

        function applySelectionToBackdrop(textarea, backdrop) {
            // 辞書ハイライトのターゲットを取得
            const targets = textarea === inputTextArea
                ? Array.from(maskingDictionary.values()).map(entry => entry.original)
                : Array.from(maskingDictionary.values()).map(entry => entry.masked);

            // 辞書ハイライトのみを適用（選択はtextareaのネイティブ機能を使用）
            backdrop.innerHTML = highlight(textarea.value, targets);
        }

        // グローバルスコープに追加
        window.updateHighlights = updateHighlights;

        // スクロール同期
        function syncScroll(source, target) {
            target.scrollTop = source.scrollTop;
            target.scrollLeft = source.scrollLeft;
        }

        // テキスト選択時のポップアップ表示
        function handleTextSelection(event) {
            const targetTextArea = event.target;
            const start = targetTextArea.selectionStart;
            const end = targetTextArea.selectionEnd;
            const text = targetTextArea.value.substring(start, end);

            if (text.trim().length > 0) {
                selectedText = text;
                selectedTextArea = targetTextArea; // 選択されたテキストエリアを記録
                selectionStart = start;
                selectionEnd = end;
                showCandidatePopup(event);
            } else {
                hideCandidatePopup();
            }
        }

        // ポップアップを表示（マウス位置付近）
        function showCandidatePopup(event) {
            updateCandidateGrid();

            // マウス位置を取得
            const mouseX = event.clientX || event.pageX;
            const mouseY = event.clientY || event.pageY;

            // ポップアップの位置を調整（画面外に出ないように）
            const popup = candidatePopup;
            popup.style.left = Math.min(mouseX + 10, window.innerWidth - 420) + 'px';
            popup.style.top = Math.min(mouseY + 10, window.innerHeight - 200) + 'px';

            popup.classList.add('show');
            popupVisible = true;
        }

        // ポップアップを非表示
        function hideCandidatePopup() {
            candidatePopup.classList.remove('show');
            popupVisible = false;
            selectedTextArea = null; // 選択されたテキストエリアをリセット
        }

        // カテゴリを設定する関数
        function setCategory(category) {
            currentCategory = category;

            // カテゴリボタンのアクティブ状態を更新
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[onclick="setCategory('${category}')"]`).classList.add('active');

            // 候補グリッドを更新
            updateCandidateGrid();
        }

        // 候補グリッドを更新する関数
        function updateCandidateGrid() {
            const candidates = candidateData[currentCategory] || [];
            candidateGrid.innerHTML = candidates.map(candidate =>
                `<div class="candidate-item" onclick="selectCandidate('${candidate.replace(/'/g, "\\'")}')">${candidate}</div>`
            ).join('');
        }

        // 候補を選択する関数（自動マスキング）
        function selectCandidate(candidate) {
            if (selectedText.trim() === '' || !selectedTextArea) {
                return;
            }

            // 辞書に追加
            addToDictionary(selectedText, candidate);

            // 選択されたテキストエリアに応じて同期処理を実行
            if (selectedTextArea === inputTextArea) {
                // 入力テキストエリアで選択された場合：入力→出力の同期
                syncInputToOutput();
            } else if (selectedTextArea === outputTextArea) {
                // 出力テキストエリアで選択された場合：出力→入力の同期
                syncOutputToInput();
            }

            // ポップアップを非表示
            hideCandidatePopup();
        }

        // 辞書に新しいエントリを追加する関数
        function addToDictionary(original, masked) {
            const key = original.toLowerCase();
            if (!maskingDictionary.has(key)) {
                maskingDictionary.set(key, {
                    original: original,
                    masked: masked,
                    count: 1,
                    lastUsed: new Date()
                });
            } else {
                const entry = maskingDictionary.get(key);
                entry.count++;
                entry.lastUsed = new Date();
            }
            updateDictionaryDisplay();

            // 自動保存
            saveDictionaryToStore();
        }

        // 辞書表示を更新する関数
        function updateDictionaryDisplay() {
            const dictionaryList = document.getElementById('dictionaryList');

            if (maskingDictionary.size === 0) {
                dictionaryList.innerHTML = `
                    <div class="dictionary-empty">まだマスキングした単語がありません</div>
                `;
                return;
            }

            // 辞書エントリを最近使用順でソート
            const entries = Array.from(maskingDictionary.entries())
                .sort((a, b) => b[1].lastUsed - a[1].lastUsed);

            dictionaryList.innerHTML = entries.map(([key, entry]) => `
                <div class="dictionary-item">
                    <div class="dictionary-content">
                        <span class="dictionary-original">${entry.original}</span>
                        <span class="dictionary-arrow">→</span>
                        <span class="dictionary-masked">${entry.masked}</span>
                        <span class="dictionary-count">(${entry.count}回)</span>
                    </div>
                    <button class="dictionary-delete" onclick="deleteDictionaryEntry('${key}')" title="削除">🗑️</button>
                </div>
            `).join('');

            // ハイライト表示を更新
            updateHighlights();
        }

        // 辞書エントリを削除する関数
        function deleteDictionaryEntry(key) {
            if (maskingDictionary.has(key)) {
                maskingDictionary.delete(key);
                updateDictionaryDisplay();

                // リアルタイム同期（削除されたエントリの影響を反映）
                syncInputToOutput();

                // 自動保存
                saveDictionaryToStore();
            }
        }

        // 入力テキストをコピーする関数
        function copyInputText() {
            const text = inputTextArea.value;
            if (text.trim() === '') {
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                // コピー成功時の処理（必要に応じて）
            }).catch(() => {
                inputTextArea.select();
            });
        }

        // マスキング済みテキストをコピーする関数
        function copyOutputText() {
            const text = outputTextArea.value;
            if (text.trim() === '') {
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                // コピー成功時の処理（必要に応じて）
            }).catch(() => {
                outputTextArea.select();
            });
        }

        // 辞書パネルのトグル機能
        function toggleDictionary() {
            dictionaryCollapsed = !dictionaryCollapsed;

            if (dictionaryCollapsed) {
                dictionaryPanel.classList.add('collapsed');
                localStorage.setItem('dictionaryCollapsed', 'true');
            } else {
                dictionaryPanel.classList.remove('collapsed');
                localStorage.setItem('dictionaryCollapsed', 'false');
            }
        }

        // 辞書パネルの状態を復元
        function restoreDictionaryState() {
            const saved = localStorage.getItem('dictionaryCollapsed');
            const isSmallScreen = window.innerWidth < 1200;

            // 小さい画面では自動的に折りたたむ、または保存された状態を復元
            if (saved === 'true' || isSmallScreen) {
                dictionaryCollapsed = true;
                dictionaryPanel.classList.add('collapsed');
            }
        }

        // ウィンドウリサイズ時の処理
        window.addEventListener('resize', function () {
            const isSmallScreen = window.innerWidth < 1200;

            if (isSmallScreen && !dictionaryCollapsed) {
                // 小さい画面になったら自動的に折りたたむ
                dictionaryCollapsed = true;
                dictionaryPanel.classList.add('collapsed');
            }
        });

        // イベントリスナーの設定
        document.addEventListener('DOMContentLoaded', async function () {
            console.log('DOM loaded, initializing application...');
            console.log('DOM elements check:');
            console.log('inputTextArea:', document.getElementById('inputText'));
            console.log('outputTextArea:', document.getElementById('outputText'));
            console.log('projectSelect:', document.getElementById('projectSelect'));

            // 基本的なイベントリスナーを先に設定
            // 入力テキストの変更をリアルタイムで同期
            inputTextArea.addEventListener('input', syncInputToOutput);
            console.log('Input event listener added');

            // 出力テキストの変更を入力テキストに逆同期
            outputTextArea.addEventListener('input', syncOutputToInput);
            console.log('Output event listener added');

            // スクロール同期を追加
            inputTextArea.addEventListener('scroll', function () {
                syncScroll(this, inputBackdrop);
            });
            outputTextArea.addEventListener('scroll', function () {
                syncScroll(this, outputBackdrop);
            });

            // テキスト選択の監視
            inputTextArea.addEventListener('mouseup', function (event) {
                handleTextSelection(event);
                updateSelectionHighlight();
            });
            inputTextArea.addEventListener('keyup', function (event) {
                // キーボード選択の場合は少し遅延させる
                setTimeout(() => {
                    handleTextSelection(event);
                    updateSelectionHighlight();
                }, 10);
            });

            // 出力テキストエリアでもテキスト選択を監視
            outputTextArea.addEventListener('mouseup', function (event) {
                handleTextSelection(event);
                updateSelectionHighlight();
            });
            outputTextArea.addEventListener('keyup', function (event) {
                // キーボード選択の場合は少し遅延させる
                setTimeout(() => {
                    handleTextSelection(event);
                    updateSelectionHighlight();
                }, 10);
            });

            // ポップアップ外クリックで非表示
            document.addEventListener('click', function (event) {
                if (popupVisible && !candidatePopup.contains(event.target) && event.target !== inputTextArea) {
                    hideCandidatePopup();
                }
                // クリック時に選択ハイライトを更新
                setTimeout(() => updateSelectionHighlight(), 10);
            });

            // 辞書パネルの状態を復元
            restoreDictionaryState();

            // 初期設定
            inputTextArea.focus();
            setCategory('symbols');

            // サンプルテキストを設定
            inputTextArea.value = 'My password is secret123 and the admin account is confidential. Please keep this information private.';
            console.log('Sample text set:', inputTextArea.value);

            // 初期同期を実行
            console.log('Calling initial syncInputToOutput...');
            syncInputToOutput();

            // 初期ハイライト表示
            updateHighlights();

            // プロジェクト管理を初期化（基本機能とは独立）
            try {
                await initializeProjectManager();

                // プロジェクト選択イベント
                projectSelect.addEventListener('change', handleProjectChange);
                newProjectBtn.addEventListener('click', handleNewProject);
                deleteProjectBtn.addEventListener('click', handleDeleteCurrentProject);
            } catch (error) {
                console.error('Project management initialization failed, but basic functionality is available:', error);
            }

            console.log('Application initialization complete');
        });

        // カスタムダイアログ関数
        async function showMessageDialog(title, message, type = 'info') {
            if (window.electronAPI && window.electronAPI.showMessageBox) {
                const options = {
                    type: type,
                    title: title,
                    message: message,
                    buttons: ['OK']
                };
                await window.electronAPI.showMessageBox(options);
            } else {
                // フォールバック
                alert(`${title}: ${message}`);
            }
        }

        async function showConfirmDialog(title, message) {
            if (window.electronAPI && window.electronAPI.showMessageBox) {
                const options = {
                    type: 'question',
                    title: title,
                    message: message,
                    buttons: ['キャンセル', 'OK'],
                    defaultId: 1,
                    cancelId: 0
                };
                const result = await window.electronAPI.showMessageBox(options);
                return result.response === 1; // OKボタンが押された場合
            } else {
                // フォールバック
                return confirm(`${title}: ${message}`);
            }
        }

        async function showInputDialog(title, message, defaultValue = '') {
            // HTMLベースのカスタム入力ダイアログを作成
            return new Promise((resolve) => {
                // ダイアログ要素を作成
                const dialog = document.createElement('div');
                dialog.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.5);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 10000;
                `;

                const dialogBox = document.createElement('div');
                dialogBox.style.cssText = `
                    background: var(--bg-secondary);
                    border: 1px solid var(--border-primary);
                    border-radius: var(--radius-md);
                    padding: var(--spacing-lg);
                    min-width: 400px;
                    max-width: 600px;
                    box-shadow: 0 16px 32px var(--shadow-medium);
                `;

                const titleElement = document.createElement('h3');
                titleElement.textContent = title;
                titleElement.style.cssText = `
                    color: var(--text-accent);
                    margin: 0 0 var(--spacing-md) 0;
                    font-size: 16px;
                `;

                const messageElement = document.createElement('p');
                messageElement.textContent = message;
                messageElement.style.cssText = `
                    color: var(--text-primary);
                    margin: 0 0 var(--spacing-md) 0;
                    white-space: pre-line;
                    font-size: 14px;
                    line-height: 1.5;
                `;

                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'customDialogInput'; // テスト用のID追加
                input.value = defaultValue;
                input.style.cssText = `
                    width: 100%;
                    padding: var(--spacing-sm);
                    border: 1px solid var(--border-secondary);
                    border-radius: var(--radius-sm);
                    background: var(--bg-tertiary);
                    color: var(--text-primary);
                    font-size: 14px;
                    margin-bottom: var(--spacing-md);
                    outline: none;
                `;

                const buttonContainer = document.createElement('div');
                buttonContainer.style.cssText = `
                    display: flex;
                    gap: var(--spacing-sm);
                    justify-content: flex-end;
                `;

                const cancelButton = document.createElement('button');
                cancelButton.textContent = 'キャンセル';
                cancelButton.style.cssText = `
                    padding: var(--spacing-sm) var(--spacing-md);
                    border: 1px solid var(--border-secondary);
                    border-radius: var(--radius-sm);
                    background: var(--bg-tertiary);
                    color: var(--text-primary);
                    cursor: pointer;
                    font-size: 14px;
                `;

                const okButton = document.createElement('button');
                okButton.textContent = 'OK';
                okButton.style.cssText = `
                    padding: var(--spacing-sm) var(--spacing-md);
                    border: 1px solid var(--accent-blue);
                    border-radius: var(--radius-sm);
                    background: var(--accent-blue);
                    color: var(--bg-primary);
                    cursor: pointer;
                    font-size: 14px;
                `;

                // イベントリスナー
                cancelButton.addEventListener('click', () => {
                    document.body.removeChild(dialog);
                    resolve('');
                });

                okButton.addEventListener('click', () => {
                    const value = input.value;
                    document.body.removeChild(dialog);
                    resolve(value);
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const value = input.value;
                        document.body.removeChild(dialog);
                        resolve(value);
                    } else if (e.key === 'Escape') {
                        document.body.removeChild(dialog);
                        resolve('');
                    }
                });

                // DOM構築
                buttonContainer.appendChild(cancelButton);
                buttonContainer.appendChild(okButton);
                dialogBox.appendChild(titleElement);
                dialogBox.appendChild(messageElement);
                dialogBox.appendChild(input);
                dialogBox.appendChild(buttonContainer);
                dialog.appendChild(dialogBox);
                document.body.appendChild(dialog);

                // フォーカス
                input.focus();
                input.select();
            });
        }

        // キーボードショートカット
        inputTextArea.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                event.preventDefault();
                if (popupVisible) {
                    hideCandidatePopup();
                } else if (document.getElementById('regexDialog').classList.contains('show')) {
                    closeRegexDialog();
                }
            }
        });
    </script>
</body>

</html>
