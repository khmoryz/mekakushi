name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'src/package-lock.json'
        
    - name: Install dependencies
      run: |
        cd src
        npm ci
        
    - name: Clean up any mounted volumes and processes
      run: |
        # Kill any existing hdiutil processes
        sudo pkill -f "hdiutil" || true
        sudo pkill -f "dmgbuild" || true
        sleep 3
        
        # List all mounted volumes
        echo "Currently mounted volumes:"
        df -h | grep -E "(Volumes|disk)" || true
        
        # Force unmount any existing Mekakushi volumes
        for vol in /Volumes/Mekakushi*; do
          if [ -d "$vol" ]; then
            echo "Unmounting $vol"
            sudo diskutil unmountDisk force "$vol" 2>/dev/null || true
            hdiutil detach "$vol" -force 2>/dev/null || true
          fi
        done
        
        # Detach any disk images that might be stuck
        for disk in $(hdiutil info | grep -E "^/dev/disk[0-9]+" | awk '{print $1}' || true); do
          echo "Attempting to detach $disk"
          hdiutil detach "$disk" -force 2>/dev/null || true
        done
        
        # Clean up temporary files
        sudo rm -rf /tmp/dmg-* 2>/dev/null || true
        sudo rm -rf /tmp/electron-* 2>/dev/null || true
        
        sleep 2
        echo "Cleanup completed"
        
    - name: Build application
      run: |
        cd src
        # Set environment variables for more stable DMG building
        export ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES=true
        export DEBUG=electron-builder
        npm run build:mac
      timeout-minutes: 30
        
    - name: List build artifacts
      run: |
        echo "Contents of src/dist:"
        ls -la src/dist/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: src/dist/*.dmg
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
