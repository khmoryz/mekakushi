name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-13
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'src/package-lock.json'
        
    - name: Install dependencies
      run: |
        cd src
        npm ci
        
    - name: Clean up any mounted volumes
      run: |
        # List all mounted volumes
        echo "Currently mounted volumes:"
        df -h
        
        # Force unmount any existing Mekakushi volumes
        for vol in /Volumes/Mekakushi*; do
          if [ -d "$vol" ]; then
            echo "Unmounting $vol"
            sudo diskutil unmountDisk force "$vol" 2>/dev/null || true
            hdiutil detach "$vol" -force 2>/dev/null || true
          fi
        done
        
        # Clean up any leftover processes
        pkill -f "hdiutil" || true
        sleep 2
        
    - name: Build application
      run: |
        cd src
        npm run build:mac
        
    - name: List build artifacts
      run: |
        echo "Contents of src/dist:"
        ls -la src/dist/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: src/dist/*.dmg
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
